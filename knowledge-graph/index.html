﻿﻿﻿<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🕸️ Knowledge Base Graph - Chuỗi Cung Ứng & SAP S/4HANA</title>

    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">

    <!-- VisNetwork for Obsidian-style Graph View -->
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>

    <style>
        :root {
            --bg-main: #070a12;
            --bg-card: rgba(15, 23, 42, 0.85);
            --border-color: rgba(30, 41, 59, 0.8);
        }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg-main);
            color: #f8fafc;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .font-heading { font-family: 'Outfit', sans-serif; }

        /* Universal Top Nav Bar */
        .nav-root {
            position: sticky;
            top: 0;
            z-index: 50;
            background: #020617;
            border-bottom: 1px solid #1e293b;
            box-shadow: 0 2px 16px rgba(0,0,0,.5);
        }
        .nav-inner {
            display: flex;
            align-items: center;
            height: 40px;
            position: relative;
        }
        .nav-track {
            flex: 1;
            overflow-x: auto;
            overflow-y: hidden;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 0 6px;
            scrollbar-width: none;
            scroll-behavior: smooth;
        }
        .nav-track::-webkit-scrollbar { display: none; }
        .nav-track a {
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 9px;
            border-radius: 7px;
            border: 1px solid transparent;
            font-size: 11px;
            font-weight: 600;
            text-decoration: none;
            white-space: nowrap;
        }
        .nav-track .nav-label {
            flex-shrink: 0;
            font-size: 9px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .07em;
            color: #334155;
            white-space: nowrap;
            padding: 0 2px;
        }
        .nav-arr {
            flex-shrink: 0;
            width: 30px;
            height: 40px;
            background: #020617;
            border: none;
            color: #475569;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 3;
        }
        .nav-arr:hover { color: #e2e8f0; }

        /* Graph Canvas Container */
        #network-container {
            flex: 1;
            width: 100%;
            height: calc(100vh - 40px);
            background: radial-gradient(circle at center, rgba(30, 58, 138, 0.15) 0%, rgba(7, 10, 18, 0.95) 70%);
            position: relative;
        }

        /* Centered High-Contrast Modal Popup */
        .info-panel-overlay {
            position: fixed;
            inset: 0;
            background: rgba(2, 6, 23, 0.75);
            backdrop-filter: blur(12px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .info-panel-overlay.active {
            display: flex !important;
        }
        .info-panel {
            width: 100%;
            max-width: 420px;
            background: #0f172a;
            border: 2px solid #e879f9;
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9), 0 0 40px rgba(232, 121, 249, 0.4);
            max-height: 85vh;
            overflow-y: auto;
            animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn {
            from { opacity: 0; transform: scale(0.85); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Glass Floating Control Bar */
        .controls-bar {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 40;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(51, 65, 85, 0.8);
            border-radius: 16px;
            padding: 12px 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
    </style>
    <script src="../components/universal-nav.js"></script>
</head>
<body>
    <universal-nav></universal-nav>

    <!-- UNIVERSAL TOP NAV -->
    

    <!-- GRAPH CANVAS -->
    <div id="network-container">
        
        <!-- CONTROLS BAR -->
        <div class="controls-bar">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-diagram-project text-fuchsia-400 text-lg"></i>
                <span class="font-heading font-bold text-sm text-white">Logistics & SAP Knowledge Graph</span>
            </div>
            <div class="h-4 w-px bg-slate-700"></div>
            <!-- Search Input -->
            <div class="relative">
                <input type="text" id="graph-search" placeholder="Tìm Node / T-Code..." class="bg-slate-900 border border-slate-700 text-xs text-white rounded-lg px-3 py-1.5 pl-8 focus:outline-none focus:border-fuchsia-500 w-44">
                <i class="fa-solid fa-search text-slate-500 text-xs absolute left-2.5 top-2.5"></i>
            </div>
            <!-- Filter Dropdown -->
            <select id="group-filter" onchange="filterGraphGroup(this.value)" class="bg-slate-900 border border-slate-700 text-xs text-slate-300 rounded-lg px-2.5 py-1.5 focus:outline-none focus:border-fuchsia-500">
                <option value="ALL">Tất cả Nhóm Node</option>
                <option value="MODULE">12 Phân hệ Hub</option>
                <option value="SAP_WM">SAP WM / EWM</option>
                <option value="SAP_MM">SAP MM / Purchasing</option>
                <option value="SAP_SD">SAP SD / Sales</option>
                <option value="FLOW">Luồng Chuỗi Cung Ứng</option>
            </select>
            <!-- Physics Toggle -->
            <button onclick="resetZoom()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs px-2.5 py-1.5 rounded-lg border border-slate-700 flex items-center gap-1">
                <i class="fa-solid fa-expand"></i> Fit Zoom
            </button>
        </div>

        <!-- CENTER POPUP MODAL OVERLAY -->
        <div class="info-panel-overlay" id="info-panel-overlay" onclick="if(event.target===this) closeInfoPanel()">
            <div class="info-panel" id="info-panel">
                <button onclick="closeInfoPanel()" class="text-slate-400 hover:text-white float-right text-sm"><i class="fa-solid fa-xmark"></i></button>
                <div id="panel-content">
                    <div class="text-center text-slate-500 py-10">
                        <i class="fa-solid fa-mouse-pointer text-3xl mb-2"></i>
                        <p class="text-xs">Nhấp vào một Nút trên mạng lưới để xem chi tiết liên kết & mở bài học / ứng dụng.</p>
                    </div>
                </div>
            </div>
        </div>

    </div>

    
</body>
</html>
