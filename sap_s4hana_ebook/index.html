<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=5.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d1117">
<meta name="description" content="SAP S/4HANA – 111 quy trình, 840 slides, 1040 hình ảnh. Tra cứu tức thì T-Code, quy trình kho WM/IM – LC Foods – Citek.">
<title>📘 SAP S/4HANA – Hướng Dẫn | LC Foods</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
:root{
  --bg:#0d1117;--surf:#161b22;--card:#1c2128;--hov:#21262d;
  --bdr:#30363d;--bdr2:#21262d;
  --txt:#e6edf3;--txt2:#8b949e;--txt3:#6e7681;
  --blue:#1f6feb;--blue2:#388bfd;--grn:#3fb950;--gold:#f0a500;--sap:#0070b1;
  --sidebar:270px;--hdr:54px;--hubnav:34px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:4px}

/* HEADER */
.hdr{position:sticky;top:var(--hubnav);z-index:900;height:var(--hdr);display:flex;align-items:center;gap:10px;padding:0 14px;background:rgba(13,17,23,.97);backdrop-filter:blur(16px);border-bottom:1px solid var(--bdr);}
.logo{display:flex;align-items:center;gap:8px;cursor:pointer;flex-shrink:0;}
.logo-box{width:30px;height:30px;border-radius:7px;background:linear-gradient(135deg,var(--sap),var(--blue));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:15px;box-shadow:0 2px 8px rgba(0,112,177,.4);}
.logo-txt{font-size:12px;font-weight:700;line-height:1.2;}
.logo-sub{font-size:9px;color:var(--txt3);}
@media(max-width:380px){.logo-txt,.logo-sub{display:none}}
.menu-btn{background:none;border:none;color:var(--txt2);width:34px;height:34px;border-radius:7px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:17px;transition:background .2s;flex-shrink:0;}
.menu-btn:hover{background:var(--hov)}
.srch{flex:1;position:relative;max-width:500px;}
.srch-ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--txt3);font-size:13px;pointer-events:none;}
#si{width:100%;height:34px;background:var(--card);border:1.5px solid var(--bdr);border-radius:17px;padding:0 32px 0 32px;color:var(--txt);font-size:13px;outline:none;transition:border-color .2s,box-shadow .2s;}
#si::placeholder{color:var(--txt3)}
#si:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(31,111,235,.15)}
.srch-clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--txt3);cursor:pointer;width:22px;height:22px;border-radius:50%;display:none;align-items:center;justify-content:center;font-size:12px;transition:color .2s;}
.srch-clr:hover{color:var(--txt)}
.nav-grp{display:flex;align-items:center;gap:5px;flex-shrink:0;}
.nav-btn{background:var(--card);border:1px solid var(--bdr);color:var(--txt2);width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;transition:all .2s;}
.nav-btn:hover{background:var(--hov);color:var(--txt);border-color:var(--blue)}
.nav-btn:disabled{opacity:.3;cursor:not-allowed}
#ch-ct{font-size:10px;color:var(--txt3);min-width:32px;text-align:center;}
@media(max-width:480px){.nav-grp{display:none}}

/* LAYOUT */
.layout{display:flex;padding-top:calc(var(--hdr) + var(--hubnav));min-height:100vh;}

/* SIDEBAR */
.sdb{position:fixed;top:calc(var(--hdr)+var(--hubnav));left:0;width:var(--sidebar);height:calc(100vh - var(--hdr) - var(--hubnav));background:var(--surf);border-right:1px solid var(--bdr);overflow-y:auto;z-index:800;transition:transform .28s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;}
.sdb.closed{transform:translateX(-100%)}
.sdb-fi{padding:8px 10px;border-bottom:1px solid var(--bdr);flex-shrink:0;}
.sdb-fi input{width:100%;height:30px;background:var(--card);border:1px solid var(--bdr);border-radius:7px;padding:0 10px;color:var(--txt);font-size:11.5px;outline:none;}
.sdb-fi input::placeholder{color:var(--txt3)}
.sdb-hdr{padding:8px 12px;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--txt3);flex-shrink:0;border-bottom:1px solid var(--bdr2);}
.sdb-list{flex:1;overflow-y:auto;}
.ch-btn{width:100%;text-align:left;background:none;border:none;padding:8px 12px 8px 10px;cursor:pointer;border-bottom:1px solid var(--bdr2);display:flex;align-items:flex-start;gap:8px;transition:background .15s;}
.ch-btn:hover{background:var(--hov)}
.ch-btn.on{background:rgba(31,111,235,.1);border-left:3px solid var(--blue);padding-left:7px;}
.ch-n{min-width:22px;height:22px;background:var(--card);border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:var(--txt3);flex-shrink:0;margin-top:1px;}
.ch-btn.on .ch-n{background:var(--blue);color:#fff;}
.ch-info{flex:1;min-width:0;}
.ch-tit{font-size:11.5px;font-weight:500;color:var(--txt2);line-height:1.4;word-break:break-word;}
.ch-btn.on .ch-tit{color:var(--txt)}
.ch-cnt{font-size:9.5px;color:var(--txt3);margin-top:1px;}

/* OVERLAY */
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:750;}
.ov.on{display:block}

/* MAIN */
.main{flex:1;margin-left:var(--sidebar);padding:16px 14px;min-width:0;transition:margin-left .28s;}
.main.full{margin-left:0}
@media(max-width:768px){
  .sdb{transform:translateX(-100%)}
  .sdb.open{transform:translateX(0)}
  .main{margin-left:0!important;padding:10px 8px;}
}

/* VIEWS */
.view{display:none;max-width:900px;margin:0 auto;animation:fi .2s ease;}
.view.on{display:block}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}

/* HOME */
.hero{background:linear-gradient(135deg,#0c1829,#0d1117 60%,#160c24);border:1px solid var(--bdr);border-radius:14px;padding:24px 20px;margin-bottom:16px;position:relative;overflow:hidden;text-align:center;}
.hero::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--sap),var(--blue2),var(--gold));}
.hero::after{content:'SAP';position:absolute;right:-16px;bottom:-24px;font-size:100px;font-weight:900;color:rgba(255,255,255,.02);pointer-events:none;}
.hero-badge{display:inline-flex;align-items:center;gap:4px;background:rgba(0,112,177,.15);border:1px solid rgba(0,112,177,.3);color:var(--blue2);padding:4px 11px;border-radius:20px;font-size:10px;font-weight:700;margin-bottom:12px;text-transform:uppercase;letter-spacing:.05em;}
.hero-ttl{font-size:clamp(17px,5vw,26px);font-weight:800;line-height:1.3;margin-bottom:5px;background:linear-gradient(135deg,#fff,#8b949e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.hero-sub{font-size:12px;color:var(--txt3);margin-bottom:18px;line-height:1.5;}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.stat{background:rgba(255,255,255,.04);border:1px solid var(--bdr);border-radius:9px;padding:12px 6px;}
.stat-n{font-size:clamp(18px,5vw,26px);font-weight:800;background:linear-gradient(135deg,var(--gold),#f5c842);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.stat-l{font-size:9.5px;color:var(--txt3);margin-top:2px;}
.sec-hdr{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--txt3);margin-bottom:10px;margin-top:4px;}
.ch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;}
.ch-card{background:var(--card);border:1px solid var(--bdr);border-radius:9px;padding:14px;cursor:pointer;transition:all .18s;position:relative;overflow:hidden;}
.ch-card::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--sap),var(--blue2));transform:scaleX(0);transition:transform .2s;transform-origin:left;}
.ch-card:hover{border-color:rgba(56,139,253,.4);background:var(--hov);transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,0,0,.3);}
.ch-card:hover::after{transform:scaleX(1)}
.card-n{font-size:9.5px;font-weight:700;color:var(--blue2);margin-bottom:5px;text-transform:uppercase;}
.card-t{font-size:12.5px;font-weight:600;color:var(--txt);line-height:1.4;margin-bottom:4px;}
.card-m{font-size:10px;color:var(--txt3);}

/* CHAPTER VIEW */
.ch-hdr{background:var(--card);border:1px solid var(--bdr);border-radius:9px;padding:14px 18px;margin-bottom:12px;position:relative;overflow:hidden;}
.ch-hdr::before{content:'';position:absolute;top:0;left:0;right:0;height:2.5px;background:linear-gradient(90deg,var(--sap),var(--blue2));}
.ch-hdr-no{font-size:9px;color:var(--txt3);margin-bottom:5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;}
.ch-hdr h1{font-size:clamp(14px,4vw,19px);font-weight:700;line-height:1.4;margin-bottom:8px;}
.tags{display:flex;gap:6px;flex-wrap:wrap;}
.tag{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:20px;font-size:9.5px;font-weight:500;border:1px solid var(--bdr);color:var(--txt2);background:var(--hov);}
.tag.b{background:rgba(31,111,235,.1);color:var(--blue2);border-color:rgba(31,111,235,.2);}
.tag.g{background:rgba(63,185,80,.08);color:var(--grn);border-color:rgba(63,185,80,.18);}

/* CONTROLS */
.ctrl{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.ctrl-l{display:flex;gap:6px;}
.ctrl-btn{background:var(--card);border:1px solid var(--bdr);color:var(--txt2);padding:4px 10px;border-radius:7px;font-size:10.5px;font-weight:500;cursor:pointer;transition:all .18s;white-space:nowrap;}
.ctrl-btn:hover{background:var(--hov);color:var(--txt);border-color:var(--blue2);}
.ctrl-r{font-size:10px;color:var(--txt3);}

/* LOADING CHAPTER */
.ch-loading{text-align:center;padding:40px 20px;color:var(--txt3);}
.ch-loading .spinner{display:inline-block;width:32px;height:32px;border:3px solid var(--bdr);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;margin-bottom:12px;}
@keyframes spin{to{transform:rotate(360deg)}}
.ch-loading p{font-size:13px;}

/* SLIDE */
.slide{background:var(--card);border:1px solid var(--bdr);border-radius:9px;margin-bottom:8px;overflow:hidden;transition:border-color .18s;}
.slide:hover{border-color:rgba(56,139,253,.22)}
.slide.hl{border-color:var(--blue)!important;box-shadow:0 0 0 2px rgba(31,111,235,.15);}
.sl-hdr{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--surf);cursor:pointer;user-select:none;transition:background .15s;border-bottom:1px solid transparent;}
.slide.open .sl-hdr{border-bottom-color:var(--bdr);}
.sl-hdr:hover{background:var(--hov)}
.sl-pg{font-family:'SF Mono','Consolas',monospace;font-size:9.5px;font-weight:700;color:var(--gold);background:rgba(240,165,0,.1);padding:2px 6px;border-radius:4px;border:1px solid rgba(240,165,0,.2);flex-shrink:0;white-space:nowrap;}
.sl-tit{flex:1;font-size:12px;font-weight:500;color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sl-ico{font-size:12px;flex-shrink:0;}
.sl-arr{color:var(--txt3);font-size:10px;transition:transform .18s;flex-shrink:0;}
.slide.open .sl-arr{transform:rotate(180deg);color:var(--blue2);}
.sl-body{display:none;padding:12px;}
.slide.open .sl-body{display:block;animation:fi .18s ease;}
.sl-imgs{display:flex;flex-direction:column;gap:7px;margin-bottom:10px;}
.sl-imgs img{width:100%;border-radius:7px;border:1px solid var(--bdr);cursor:zoom-in;transition:border-color .2s;display:block;}
.sl-imgs img:hover{border-color:rgba(56,139,253,.45);}
.sl-txt{font-size:12px;line-height:1.75;color:var(--txt2);white-space:pre-wrap;word-break:break-word;}

/* SEARCH */
.sr-hdr{background:var(--card);border:1px solid var(--bdr);border-radius:9px;padding:11px 16px;margin-bottom:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.sr-hdr h2{font-size:13px;font-weight:600;}
.sr-cnt{font-size:10px;color:var(--txt3);margin-left:auto;}
.sr-card{background:var(--card);border:1px solid var(--bdr);border-radius:9px;padding:12px 16px;margin-bottom:7px;cursor:pointer;transition:border-color .18s,background .18s;}
.sr-card:hover{border-color:var(--blue);background:var(--hov);}
.sr-ch{font-size:9.5px;font-weight:700;color:var(--blue2);text-transform:uppercase;margin-bottom:4px;}
.sr-pg{font-size:9.5px;color:var(--gold);float:right;font-family:monospace;}
.sr-txt{font-size:12px;color:var(--txt2);line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.sr-txt mark{background:rgba(240,165,0,.18);color:var(--gold);border-radius:2px;padding:0 2px;}

/* EMPTY */
.empty{text-align:center;padding:50px 20px;color:var(--txt3);}
.empty-ico{font-size:40px;margin-bottom:10px;}
.empty-t{font-size:15px;font-weight:600;color:var(--txt2);margin-bottom:6px;}

/* LIGHTBOX */
#lb{display:none;position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.93);align-items:center;justify-content:center;padding:16px;}
#lb.on{display:flex;}
#lb img{max-width:100%;max-height:88vh;border-radius:8px;box-shadow:0 0 60px rgba(0,0,0,.8);object-fit:contain;}
.lb-x{position:fixed;top:12px;right:12px;background:var(--card);border:1px solid var(--bdr);color:var(--txt);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;z-index:2001;transition:background .2s;}
.lb-x:hover{background:var(--hov)}

/* NAV BAR BETWEEN CHAPTERS */
.ch-nav-bar{display:flex;gap:8px;justify-content:space-between;margin-top:14px;padding-top:12px;border-top:1px solid var(--bdr);}
.ch-nav-c{flex:1;max-width:48%;background:var(--card);border:1px solid var(--bdr);border-radius:9px;padding:10px 14px;cursor:pointer;transition:all .18s;}
.ch-nav-c:hover{border-color:var(--blue);background:var(--hov);}
.ch-nav-l{font-size:8.5px;color:var(--txt3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px;}
.ch-nav-t{font-size:11.5px;font-weight:600;color:var(--txt);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}

/* LOADING SCREEN */
#ls{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;}
.ls-logo{width:56px;height:56px;border-radius:13px;background:linear-gradient(135deg,var(--sap),var(--blue));display:flex;align-items:center;justify-content:center;color:#fff;font-size:26px;font-weight:900;box-shadow:0 8px 28px rgba(0,112,177,.5);animation:pp 1.8s ease-in-out infinite;}
@keyframes pp{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.ls-t{font-size:16px;font-weight:700;}
.ls-s{font-size:11px;color:var(--txt3);}
.ls-bar{width:160px;height:3px;background:var(--bdr);border-radius:3px;overflow:hidden;}
.ls-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--sap),var(--blue2));animation:ld 1.6s ease-in-out infinite;}
@keyframes ld{0%{width:0;margin-left:0}50%{width:60%;margin-left:20%}100%{width:0;margin-left:100%}}

/* FAB */
#fab{position:fixed;bottom:16px;right:12px;z-index:800;width:38px;height:38px;background:var(--blue);color:#fff;border:none;border-radius:50%;cursor:pointer;font-size:15px;display:none;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(31,111,235,.4);transition:transform .2s;}
#fab.on{display:flex;}
#fab:hover{transform:translateY(-2px);}
</style>
</head>

<!-- OVERLAY -->
<div class="ov" id="ov" onclick="closeSdb()"></div>

<!-- HEADER -->
<header class="hdr">
  <button class="menu-btn" onclick="toggleSdb()">☰</button>
  <div class="logo" onclick="goHome()">
    <div class="logo-box">S</div>
    <div><div class="logo-txt">SAP S/4HANA</div><div class="logo-sub">Hướng Dẫn Sử Dụng</div></div>

    <span class="srch-ico">🔍</span>

// ════ STATE ════
let curCh=-1, sdbOpen=false, srchTmr=null;
const CACHE = {};  // Cache chapters da tai

// ════ INIT ════
window.addEventListener('DOMContentLoaded', () => {
  buildSdb();
  buildHome();

  // Search
  const si = document.getElementById('si');
  si.addEventListener('input', () => {
    clearTimeout(srchTmr);
    const q = si.value.trim();
    document.getElementById('sc').style.display = q ? 'flex' : 'none';
    srchTmr = setTimeout(() => q ? doSearch(q) : showHome(), 260);
  });

  // Scroll FAB
  window.addEventListener('scroll', () => {
    document.getElementById('fab').classList.toggle('on', scrollY > 250);
  });

  // Hide loading (data is tiny, loads instantly)
  document.getElementById('ls-msg').textContent = 'Sẵn sàng!';
  setTimeout(() => {
    const ls = document.getElementById('ls');
    ls.style.transition = 'opacity .3s';
    ls.style.opacity = '0';
    setTimeout(() => ls.style.display='none', 320);
    showView('vHome');
  }, 400);
});

// ════ SIDEBAR ════
function buildSdb() {
  document.getElementById('sdb-list').innerHTML = CH_LIST.map((c,i) => `
    <button class="ch-btn" id="cb-${i}" onclick="showChapter(${i})">
      <div class="ch-n">${i+1}</div>
      <div class="ch-info">
        <div class="ch-tit">${esc(c.title)}</div>
        <div class="ch-cnt">${c.slide_count} slide · tr.${c.start_page}-${c.end_page}</div>
      </div>
    </button>`).join('');
}
function filterSdb(q) {
  q = q.toLowerCase();
  document.querySelectorAll('.ch-btn').forEach((b,i) => {
    b.style.display = (!q || CH_LIST[i].title.toLowerCase().includes(q)) ? '' : 'none';
  });
}
function toggleSdb() {
  sdbOpen = !sdbOpen;
  const sdb = document.getElementById('sdb');
  const mob = innerWidth <= 768;
  sdb.classList.toggle('closed', !sdbOpen);
  sdb.classList.toggle('open', sdbOpen && mob);
  document.getElementById('ov').classList.toggle('on', sdbOpen && mob);
  if (!mob) document.getElementById('main').style.marginLeft = sdbOpen ? 'var(--sidebar)' : '0';
}
function closeSdb() {
  sdbOpen=false;
  document.getElementById('sdb').classList.add('closed');
  document.getElementById('sdb').classList.remove('open');
  document.getElementById('ov').classList.remove('on');
  document.getElementById('main').style.marginLeft = '0';
}

    </div>
    <div class="sec-hdr">📋 Tất Cả Quy Trình – Bấm để mở</div>
    <div class="ch-grid">
      ${CH_LIST.map((c,i) => `
        <div class="ch-card" onclick="showChapter(${i})">
          <div class="card-n">QT ${String(i+1).padStart(2,'0')}</div>
          <div class="card-t">${esc(c.title)}</div>
          <div class="card-m">📄 ${c.slide_count} slide · 🖼️ ${c.img_count} ảnh</div>
        </div>`).join('')}
    </div>`;
}

// ════ CHAPTER (LAZY LOAD) ════
async function showChapter(idx) {
  curCh = idx;
  const c = CH_LIST[idx];

  // Sidebar active
  document.querySelectorAll('.ch-btn').forEach(b => b.classList.remove('on'));
  const cb = document.getElementById(`cb-${idx}`);
  if (cb) { cb.classList.add('on'); cb.scrollIntoView({block:'nearest'}); }
  updateNav();

  // Show loading state immediately
  document.getElementById('vCh').innerHTML = `
    <div class="ch-hdr">
      <div class="ch-hdr-no">QUY TRÌNH ${String(idx+1).padStart(2,'0')} / ${CH_LIST.length}</div>
      <h1>${esc(c.title)}</h1>
      <div class="tags">
        <span class="tag b">📄 ${c.slide_count} slide</span>
        <span class="tag">📃 Tr.${c.start_page}–${c.end_page}</span>
      </div>
    </div>
    <div class="ch-loading">
      <div class="spinner"></div>
      <p>Đang tải ${c.slide_count} slides... (~${Math.round(c.img_count*0.3)}KB)</p>
    </div>`;
  showView('vCh');
  window.scrollTo({top:0, behavior:'smooth'});
  if (innerWidth <= 768) closeSdb();

  // Fetch chapter data (with cache)
  let chData;
  if (CACHE[idx]) {
    chData = CACHE[idx];
  } else {
    try {
      const res = await fetch(c.file);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      chData = await res.json();
      CACHE[idx] = chData;  // Cache in RAM
    } catch(e) {
      document.getElementById('vCh').innerHTML += `
        <div class="empty">
          <div class="empty-ico">⚠️</div>
          <div class="empty-t">Không tải được dữ liệu</div>
          <p style="font-size:12px;color:var(--txt3)">${e.message}</p>
        </div>`;
      return;
    }
  }

  // Render slides
  renderChapter(idx, chData);
}

function renderChapter(idx, ch) {
  const prev = idx > 0 ? CH_LIST[idx-1] : null;
  const next = idx < CH_LIST.length-1 ? CH_LIST[idx+1] : null;
  const c    = CH_LIST[idx];
  const imgTotal = ch.slides.reduce((s,sl)=>s+sl.images.length, 0);

  const slides = ch.slides.map((sl, si) => {
    const rawLines = sl.text ? sl.text.split('\n').filter(l=>l.trim()) : [];
    const title = rawLines.find(l=>l.length>3&&l.length<120) || `Slide ${sl.page}`;
    const hasImg = sl.images.length > 0;
    const imgHtml = hasImg
      ? `<div class="sl-imgs">${sl.images.map(b64=>
          `<img src="data:image/jpeg;base64,${b64}" loading="lazy" alt="SAP tr.${sl.page}" onclick="openLb(this)">`
        ).join('')}</div>`
      : '';
    const txtHtml = sl.text ? `<div class="sl-txt">${esc(sl.text)}</div>` : '';
    return `
      <div class="slide${si<2?' open':''}" id="sl-${sl.page}">
        <div class="sl-hdr" onclick="this.parentElement.classList.toggle('open')">
          <span class="sl-ico">${hasImg?'🖼️':'📝'}</span>
          <span class="sl-pg">Tr.${sl.page}</span>
          <span class="sl-tit">${esc(title.slice(0,90))}</span>
          <span class="sl-arr">▼</span>
        </div>
        <div class="sl-body">${imgHtml}${txtHtml}
          ${!imgHtml&&!txtHtml?'<div style="color:var(--txt3);font-size:12px">Trang trống</div>':''}
        </div>
      </div>`;
  }).join('');

  const navBar = `
    <div class="ch-nav-bar">
      <div class="ch-nav-c" onclick="${prev?`showChapter(${idx-1})`:''}" style="${prev?'':'opacity:.35;cursor:default'}">
        <div class="ch-nav-l">‹ Trước</div>
        <div class="ch-nav-t">${prev?esc(prev.title):'Đầu tài liệu'}</div>
      </div>
      <div class="ch-nav-c" onclick="${next?`showChapter(${idx+1})`:''}" style="${next?'text-align:right':'opacity:.35;cursor:default;text-align:right'}">
        <div class="ch-nav-l">Sau ›</div>
        <div class="ch-nav-t">${next?esc(next.title):'Cuối tài liệu'}</div>
      </div>
    </div>`;

  document.getElementById('vCh').innerHTML = `
    <div class="ch-hdr">
      <div class="ch-hdr-no">QUY TRÌNH ${String(idx+1).padStart(2,'0')} / ${CH_LIST.length}</div>
      <h1>${esc(ch.title)}</h1>
      <div class="tags">
        <span class="tag b">📄 ${c.slide_count} slide</span>
        <span class="tag">📃 Tr.${c.start_page}–${c.end_page}</span>
        <span class="tag g">🖼️ ${imgTotal} hình</span>
      </div>
    </div>
    <div class="ctrl">
      <div class="ctrl-l">
        <button class="ctrl-btn" onclick="document.querySelectorAll('#vCh .slide').forEach(s=>s.classList.add('open'))">📂 Mở tất cả</button>
        <button class="ctrl-btn" onclick="document.querySelectorAll('#vCh .slide').forEach(s=>s.classList.remove('open'))">📁 Thu gọn</button>
      </div>
      <span class="ctrl-r">${ch.slides.filter(s=>s.images.length>0).length} slides có hình · ${ch.slides.filter(s=>s.text.trim()).length} có text</span>
    </div>
    ${slides}
    ${navBar}`;
}

// ════ CHAPTER NAV ════
function navCh(dir) { const n=curCh+dir; if(n>=0&&n<CH_LIST.length) showChapter(n); }
function updateNav() {
  document.getElementById('nb-p').disabled = curCh <= 0;
  document.getElementById('nb-n').disabled = curCh >= CH_LIST.length-1;
  document.getElementById('ch-ct').textContent = curCh>=0 ? `${curCh+1}/${CH_LIST.length}` : '–';
}

// ════ SEARCH ════
function doSearch(q) {
  const ql = q.toLowerCase();
  const res = SIDX.filter(it =>
    it.text.toLowerCase().includes(ql) || it.chapter.toLowerCase().includes(ql)
  ).slice(0, 60);
  const hl = t => esc(t).replace(new RegExp(ql.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'), m=>`<mark>${m}</mark>`);
  const html = res.length
    ? res.map(r=>`
        <div class="sr-card" onclick="jumpTo(${r.page},'${r.chapter_id}')">
          <div class="sr-ch">${esc(r.chapter)}<span class="sr-pg">Tr.${r.page}</span></div>
          <div class="sr-txt">${hl(r.text.slice(0,220))}</div>
        </div>`).join('')
    : `<div class="empty"><div class="empty-ico">🔍</div><div class="empty-t">Không tìm thấy</div></div>`;
  document.getElementById('vSrch').innerHTML = `
    <div class="sr-hdr">
      <h2>🔍 "<span style="color:var(--gold)">${esc(q)}"</span></h2>
      <span class="sr-cnt">${res.length} kết quả</span>
    </div>${html}`;
  showView('vSrch');
}
function jumpTo(page, chId) {
  const ci = CH_LIST.findIndex(c=>c.id===chId);
  if (ci<0) return;
  showChapter(ci).then ? 0 : 0;
  showChapter(ci);
  setTimeout(() => {
    const el = document.getElementById(`sl-${page}`);
    if (el) {
      el.scrollIntoView({behavior:'smooth',block:'start'});
      el.classList.add('open','hl');
      setTimeout(()=>el.classList.remove('hl'),2500);
    }
  }, 600);
}
function clearSrch() {
  document.getElementById('si').value='';
  document.getElementById('sc').style.display='none';
  showHome();
}

// ════ VIEWS ════
function showHome() {
  curCh=-1;
  document.querySelectorAll('.ch-btn').forEach(b=>b.classList.remove('on'));
  updateNav();
  showView('vHome');
}
function goHome() { clearSrch(); showHome(); }
function showView(id) {
  ['vHome','vSrch','vCh'].forEach(v=>{
    const el=document.getElementById(v);
    el.classList.toggle('on', el.id===id);
  });
}

// ════ LIGHTBOX ════
function openLb(img) {
  document.getElementById('lb-img').src = img.src;
  document.getElementById('lb').classList.add('on');
  document.body.style.overflow='hidden';
}
function closeLb(e) {
  if (e&&e.target===document.getElementById('lb-img')) return;
  document.getElementById('lb').classList.remove('on');
  document.body.style.overflow='';
}
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeLb(null); });

// ════ UTILS ════
function esc(s) {
  if(!s)return'';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
